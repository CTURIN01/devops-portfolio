apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ops-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CTURIN01/devops-portfolio
    targetRevision: HEAD
    path: k8s/ops-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: ops-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
