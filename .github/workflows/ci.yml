name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: devops_db
          MYSQL_USER: devops_user
          MYSQL_PASSWORD: devopspassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run migrations
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
          DB_NAME: devops_db
          DB_USER: devops_user
          DB_PASSWORD: devopspassword
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
        run: |
          cd backend
          python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DEBUG: "True"
          DB_NAME: devops_db
          DB_USER: devops_user
          DB_PASSWORD: devopspassword
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
        run: |
          cd backend
          python manage.py test

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd backend
          docker build -t devops-portfolio-api:latest .

      - name: Verify image built
        run: docker images devops-portfolio-api
