services:
  db:
    image: mysql:8.0
    container_name: ops_platform_db
    restart: always
    environment:
      MYSQL_DATABASE: ops_platform_db
      MYSQL_USER: ops_user
      MYSQL_PASSWORD: ops_password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
    container_name: ops_platform_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      NOTIFICATION_SERVICE_URL: http://notification-service:5001
    depends_on:
      db:
        condition: service_healthy
      notification-service:
        condition: service_started
    restart: on-failure

  notification-service:
    build:
      context: ./notification-service
    container_name: notification_service
    restart: unless-stopped
    ports:
      - "5001:5001"

volumes:
  mysql_data: